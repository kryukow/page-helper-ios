name: Build unsigned iPhone IPA
on:
  push:
    branches: [main]
    paths: ['App/**', 'Shared/**', 'Extension/**', 'TranslationExtension/**', 'WebExtension/**', 'scripts/**', '.github/workflows/**', 'project.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Check source package
        run: python3 scripts/check_public.py
      - name: Test streamed translation handling
        run: |
          mkdir -p build
          swiftc Shared/TranslationTextStream.swift scripts/test_translation_stream.swift -o build/stream-tests
          build/stream-tests
      - name: Test Safari native progress and cancellation
        run: |
          swiftc Extension/SafariStreamCoordinator.swift scripts/test_safari_coordinator.swift -o build/safari-stream-tests
          build/safari-stream-tests
      - name: Check Safari JavaScript syntax
        run: |
          for source in WebExtension/*.js; do node --check "$source"; done
      - name: Install project generator
        run: brew install xcodegen
      - name: Generate explicit app icon sizes
        run: python3 scripts/prepare_icons.py
      - name: Generate Xcode project
        run: xcodegen generate
      - name: Compile for iPhone without signing
        run: >-
          xcodebuild -project PlusTranslate.xcodeproj -scheme PlusTranslate
          -configuration Release -sdk iphoneos -destination 'generic/platform=iOS'
          -derivedDataPath build CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO
      - name: Package unsigned IPA
        run: |
          mkdir -p build/package/Payload
          cp -R build/Build/Products/Release-iphoneos/PlusTranslate.app build/package/Payload/
          test -d build/package/Payload/PlusTranslate.app/PlugIns/SafariExtension.appex
          test -d build/package/Payload/PlusTranslate.app/Extensions/TranslationExtension.appex
          cd build/package
          zip -qr ../PlusTranslate-unsigned.ipa Payload
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: PlusTranslate-unsigned-IPA
          path: build/PlusTranslate-unsigned.ipa
          retention-days: 3
          if-no-files-found: error
