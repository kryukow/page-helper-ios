name: PlusTranslate
options:
  bundleIdPrefix: com.kryukov
  deploymentTarget:
    iOS: '17.0'
settings:
  base:
    SWIFT_VERSION: '5.0'
    CODE_SIGNING_ALLOWED: NO
    TARGETED_DEVICE_FAMILY: '1,2'
    MARKETING_VERSION: '0.1.3'
    CURRENT_PROJECT_VERSION: '4'
targets:
  PlusTranslate:
    type: application
    platform: iOS
    sources:
      - App
      - Shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.kryukov.plustranslate
        INFOPLIST_FILE: App/Info.plist
        CODE_SIGN_ENTITLEMENTS: Shared/Shared.entitlements
    dependencies:
      - target: SafariExtension
        embed: true
  SafariExtension:
    type: app-extension
    platform: iOS
    sources:
      - Extension
      - Shared
      - path: WebExtension
        buildPhase: resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.kryukov.plustranslate.safari
        INFOPLIST_FILE: Extension/Info.plist
        CODE_SIGN_ENTITLEMENTS: Shared/Shared.entitlements
        APPLICATION_EXTENSION_API_ONLY: YES
schemes:
  PlusTranslate:
    build:
      targets:
        PlusTranslate: all
